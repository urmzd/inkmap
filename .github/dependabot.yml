# Keeps the pinned action commits current. Dependabot updates the SHA and its version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks before proposing a new release. A release that is only days old has not
    # been vetted by anyone. Security updates are not delayed by this.
    cooldown:
      default-days: 14
