[project]
name = "inkmap"
version = "0.1.0"
description = "Map photos of existing tattoos onto a 3D arm, find the bare skin, and try new designs on it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
inkmap = "inkmap.cli:main"

[project.urls]
Repository = "https://github.com/urmzd/inkmap"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkmap"]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
